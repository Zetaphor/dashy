# yaml-language-server: $schema=https://raw.githubusercontent.com/Lissy93/dashy/master/src/utils/config/ConfigSchema.json
appConfig:
  theme: zetaphor-green
  cssThemes: [zetaphor-green]
  customColors:
    zetaphor-green:
      primary: "#57c779"
      background: "#333333"
      background-darker: "#262626"
      font-monospace: "'Hack', 'PTMono', ui-monospace, Menlo, Monaco, Consolas, 'Courier New', monospace"
      heading-text-color: "#d9f7df"
      nav-link-text-color: "#cccccc"
      nav-link-background-color: "#3a3a3a"
      nav-link-text-color-hover: "#f2fff5"
      nav-link-background-color-hover: "#454545"
      nav-link-border-color: "#4f7a58"
      nav-link-border-color-hover: "#57c779"
      search-container-background: "#2a2a2a"
      search-field-background: "#2f2f2f"
      settings-background: "#2f2f2f"
      settings-text-color: "#cccccc"
      item-text-color: "#cccccc"
      item-group-outer-background: "#4a9f5f"
      item-group-background: "#2c2c2cf2"
      item-group-heading-text-color: "#1f2d23"
      item-group-heading-text-color-hover: "#ffffff"
      footer-text-color: "#a8a8a8"
      footer-text-color-link: "#7dd89a"
      scroll-bar-color: "#57c779"
      scroll-bar-background: "#242424"
      highlight-background: "#57c779"
      highlight-color: "#1f1f1f"
      toast-background: "#57c779"
      toast-color: "#1f1f1f"
      welcome-popup-background: "#2b2b2b"
      welcome-popup-text-color: "#cccccc"
      side-bar-background: "#242424"
      side-bar-color: "#cccccc"
      status-check-tooltip-background: "#242424"
      status-check-tooltip-color: "#d5f5dc"
      context-menu-color: "#cccccc"
      context-menu-background: "#2f2f2f"
      context-menu-secondary-color: "#4f7a58"
  statusCheck: false
  layout: vertical
  iconSize: medium
  language: en
pageInfo:
  title: Homelab Dashboard
sections:
  - name: Daily Apps
    icon: fas fa-house
    displayData:
      color: "#4a9f5f"
    items:
      - title: Vikunja
        description: Task board (todo/project management)
        url: https://board.zetaphor.space
        icon: fas fa-list-check
      - title: Reactor Pages
        description: Pi Reactor artifact browser
        url: https://pages.zetaphor.space
        icon: fas fa-file-code
      - title: DSH Reactor
        description: Scheduled jobs dashboard (DSH web right sidebar Reactor tab)
        url: https://dsharness.zetaphor.space
        icon: fas fa-tasks
      - title: Hister
        description: History search and index
        url: https://hister.zetaphor.space
        icon: fas fa-history
      - title: Health
        description: Gadgetbridge health UI and API
        url: https://health.zetaphor.space
        icon: fas fa-heart
      - title: Pi Web
        description: Pi Coding Agent web UI
        url: https://pi.zetaphor.space
        icon: fas fa-window-maximize
      - title: DeepSeek Harness
        description: DeepSeek agent harness web UI (Cordis plugins)
        url: https://dsharness.zetaphor.space
        icon: fas fa-robot
      - title: Verdant
        description: llm-wiki markdown viewer/editor
        url: https://wiki.zetaphor.space
        icon: fas fa-book
      - title: PushLink
        description: Pushbullet alternative for URLs, text, files, RSS
        url: https://push.zetaphor.space
        icon: fas fa-paper-plane

  - name: Media Stack
    icon: fas fa-photo-film
    displayData:
      color: "#3f8f9f"
    items:
      - title: Navidrome
        description: Music server
        url: https://navidrome.zetaphor.space
        icon: fas fa-music
      - title: slskd
        description: Soulseek daemon UI
        url: https://soulseek.zetaphor.space
        icon: fas fa-network-wired
      - title: SoulSync
        description: SoulSync web UI
        url: https://music.zetaphor.space
        icon: fas fa-compact-disc

  - name: Theta Services
    icon: fas fa-server
    displayData:
      color: "#4f7a58"
    items:
      - title: Plex
        description: Media server
        url: https://plex.zetaphor.space/web
        icon: fas fa-tv
      - title: Radarr
        description: Movie library manager
        url: https://radarr.zetaphor.space
        icon: fas fa-film
      - title: Sonarr
        description: TV library manager
        url: https://sonarr.zetaphor.space
        icon: fas fa-tv
      - title: Prowlarr
        description: Indexer manager
        url: https://prowlarr.zetaphor.space
        icon: fas fa-compass
      - title: Bazarr
        description: Subtitle manager
        url: https://bazarr.zetaphor.space
        icon: fas fa-closed-captioning
      - title: SABnzbd
        description: NZB downloader
        url: https://sabnzbd.zetaphor.space
        icon: fas fa-download
      - title: Overseerr
        description: Media request manager
        url: https://overseerr.zetaphor.space
        icon: fas fa-tasks
      - title: Tautulli
        description: Plex analytics
        url: https://tautulli.zetaphor.space
        icon: fas fa-chart-line
      - title: Recommendarr
        description: Media recommendations
        url: https://recommendarr.zetaphor.space
        icon: fas fa-thumbs-up
      - title: Syncthing
        description: Sync service UI
        url: https://syncthing.zetaphor.space
        icon: fas fa-sync-alt
      - title: Speedtest
        description: Network speed tracker
        url: https://speedtest.zetaphor.space
        icon: fas fa-tachometer-alt
      - title: Pi-hole
        description: DNS and ad blocking
        url: https://pihole.zetaphor.space/admin
        icon: fas fa-shield-alt
      - title: SearXNG
        description: Metasearch on theta
        url: https://searx-theta.zetaphor.space
        icon: fas fa-search
      - title: Profilarr
        description: '*arr config management'
        url: https://profilarr.zetaphor.space
        icon: fas fa-sliders-h

  - name: AI and Research
    icon: fas fa-brain
    displayData:
      color: "#6c8f4a"
    items:
      - title: LiteLLM
        description: LLM gateway
        url: https://litellm.zetaphor.space/ui
        icon: fas fa-robot
      - title: OpenCode
        description: OpenCode 2 coding agent web UI (opencode.service → :49374, login user "opencode"; LiteLLM + OpenCode Go providers)
        url: https://opencode.zetaphor.space
        icon: fas fa-terminal
      - title: Jev API
        description: Local System One API (jev-api.service → Qwen3.5-4B Q4 CPU)
        url: https://jevapi.zetaphor.space/health
        icon: fas fa-code-branch
      - title: Qwen ASR (zephyrus)
        description: Qwen3-ASR-1.7B int4 ONNX on the zephyrus laptop (qwen3-asr-service → :8006, multilingual + hotwords, LAN health check — default dictation route since 2026-10-04, replaced Oído)
        url: http://192.168.50.40:8006/health
        icon: fas fa-microphone
      - title: Gemma 4 E2B Rewrite (zephyrus)
        description: Gemma-4-E2B-it QAT GGUF + MTP drafter, llama-server OpenAI API for natural-tone rewrites (gemma4-e2b.service → :8081, RTX 2060 Max-Q, ~111 t/s decode)
        url: http://192.168.50.40:8081/health
        icon: fas fa-feather-alt
      - title: Lemonade
        description: NPU inference server
        url: https://lemonade.zetaphor.space
        icon: fas fa-lemon
      - title: llama-swap
        description: Model router UI and API
        url: https://swap.zetaphor.space
        icon: fas fa-random
      - title: J-Lens
        description: GGUF visualization
        url: https://jlens.zetaphor.space
        icon: fas fa-microscope
      - title: J-Wash
        description: Jacobian model editing studio
        url: https://jwash.zetaphor.space
        icon: fas fa-soap
      - title: Mnemis
        description: Mnemis app
        url: https://mnemis.zetaphor.space
        icon: fas fa-brain
      - title: Understory
        description: Understory app
        url: https://understory.zetaphor.space
        icon: fas fa-leaf
      - title: ComfyUI
        description: Image generation UI
        url: https://comfyui.zetaphor.space
        icon: fas fa-image
      - title: Imagegen Studio
        description: Local image workbench, xor/base64 encrypted proxy (sd.cpp, 4070)
        url: https://imagegen.zetaphor.space
        icon: fas fa-wand-magic-sparkles
      - title: sd.cpp WebUI
        description: Upstream sdcpp-webui → shared Qwen sd-server
        url: https://sdwebui.zetaphor.space
        icon: fas fa-palette
      - title: Vane
        description: AI search engine
        url: https://vane.zetaphor.space
        icon: fas fa-compass

  - name: Ops and Runtime
    icon: fas fa-screwdriver-wrench
    displayData:
      color: "#8a6b4a"
    items:
      - title: SearXNG
        description: Metasearch on sigma
        url: https://searx.zetaphor.space
        icon: fas fa-search
      - title: Remote Desktops
        description: Choose a browser VNC session (sigma :0, bosgame :1, zephyrus :0, alpha)
        url: https://desktop.zetaphor.space/
        icon: fas fa-display
      - title: Sigma Desktop
        description: Live XFCE desktop on sigma (:0)
        url: https://desktop.zetaphor.space/vnc.html?autoconnect=1&resize=scale
        icon: fas fa-desktop
      - title: Bosgame Desktop
        description: Virtual XFCE session on bosgame (:1, SSH tunnel)
        url: https://desktop.zetaphor.space/bosgame/vnc.html?autoconnect=1&resize=scale
        icon: fas fa-laptop
      - title: Zephyrus Desktop
        description: Live XFCE desktop on zephyrus (:0, SSH tunnel)
        url: https://desktop.zetaphor.space/zephyrus/vnc.html?autoconnect=1&resize=scale
        icon: fas fa-laptop-code
      - title: OpenSim Grid (zephyrus)
        description: OpenSim 0.9.3.1-dev standalone+Hypergrid personal grid — 3x3 wind-themed region block centered on Zephyrus (opensim.service → :9000, SQLite, region map tile; viewer login http://192.168.50.40:9000)
        url: http://192.168.50.40:9000/map/?method=get&x=0&y=0&z=0&width=256&height=256
        icon: fas fa-globe
      - title: Alpha Desktop
        description: Live KDE Plasma (Wayland) desktop on alpha (SSH tunnel)
        url: https://desktop.zetaphor.space/alpha/vnc.html?autoconnect=1&resize=scale
        icon: fas fa-laptop
      - title: Files
        description: FileBrowser Quantum — sigma home dir, no login
        url: https://files.zetaphor.space
        icon: fas fa-folder-open
      - title: Beszel
        description: Server monitoring — sigma, alpha, theta, zetaphor.com
        url: https://monitor.zetaphor.space
        icon: fas fa-gauge-high
      - title: SysD Manager
        description: SysD Manager GUI for systemd units (browser VNC)
        url: https://systemd.zetaphor.space/vnc.html?autoconnect=1&resize=scale
        icon: fas fa-cogs
      - title: Pi Manager
        description: Pi manager endpoint
        url: https://pi-manager.zetaphor.space
        icon: fas fa-microchip
      - title: Crawl4AI
        description: Crawl4AI endpoint
        url: https://crawler.zetaphor.space
        icon: fas fa-spider
      - title: Supernote
        description: Supernote private cloud
        url: https://supernote.zetaphor.space
        icon: fas fa-book
pages: []
