# yaml-language-server: $schema=https://raw.githubusercontent.com/Lissy93/dashy/master/src/utils/config/ConfigSchema.json
appConfig:
  theme: zetaphor-green
  cssThemes: [zetaphor-green]
  customColors:
    zetaphor-green:
      primary: "#57c779"
      background: "#333333"
      background-darker: "#262626"
      font-monospace: "'Hack', 'PTMono', ui-monospace, Menlo, Monaco, Consolas, 'Courier New', monospace"
      heading-text-color: "#d9f7df"
      nav-link-text-color: "#cccccc"
      nav-link-background-color: "#3a3a3a"
      nav-link-text-color-hover: "#f2fff5"
      nav-link-background-color-hover: "#454545"
      nav-link-border-color: "#4f7a58"
      nav-link-border-color-hover: "#57c779"
      search-container-background: "#2a2a2a"
      search-field-background: "#2f2f2f"
      settings-background: "#2f2f2f"
      settings-text-color: "#cccccc"
      item-text-color: "#cccccc"
      item-group-outer-background: "#4a9f5f"
      item-group-background: "#2c2c2cf2"
      item-group-heading-text-color: "#1f2d23"
      item-group-heading-text-color-hover: "#ffffff"
      footer-text-color: "#a8a8a8"
      footer-text-color-link: "#7dd89a"
      scroll-bar-color: "#57c779"
      scroll-bar-background: "#242424"
      highlight-background: "#57c779"
      highlight-color: "#1f1f1f"
      toast-background: "#57c779"
      toast-color: "#1f1f1f"
      welcome-popup-background: "#2b2b2b"
      welcome-popup-text-color: "#cccccc"
      side-bar-background: "#242424"
      side-bar-color: "#cccccc"
      status-check-tooltip-background: "#242424"
      status-check-tooltip-color: "#d5f5dc"
      context-menu-color: "#cccccc"
      context-menu-background: "#2f2f2f"
      context-menu-secondary-color: "#4f7a58"
  statusCheck: false
  layout: vertical
  iconSize: medium
  language: en
pageInfo:
  title: Homelab Dashboard
sections:
  - name: Daily Apps
    icon: fas fa-house
    displayData:
      color: "#4a9f5f"
    items:
      - title: Reactor Pages
        description: Pi Reactor artifact browser
        url: https://pages.zetaphor.space
        icon: fas fa-file-code
      - title: DSH Reactor
        description: Scheduled jobs dashboard (DSH web right sidebar Reactor tab)
        url: https://dsharness.zetaphor.space
        icon: fas fa-tasks
      - title: Hister
        description: History search and index
        url: https://hister.zetaphor.space
        icon: fas fa-history
      - title: Health
        description: Gadgetbridge health UI and API
        url: https://health.zetaphor.space
        icon: fas fa-heart
      - title: Pi Web
        description: Pi Coding Agent web UI
        url: https://pi.zetaphor.space
        icon: fas fa-window-maximize
      - title: DeepSeek Harness
        description: DeepSeek agent harness web UI (Cordis plugins)
        url: https://dsharness.zetaphor.space
        icon: fas fa-robot
      - title: Verdant
        description: llm-wiki markdown viewer/editor
        url: https://wiki.zetaphor.space
        icon: fas fa-book
      - title: PushLink
        description: Pushbullet alternative for URLs, text, files, RSS
        url: https://push.zetaphor.space
        icon: fas fa-paper-plane

  - name: Media Stack
    icon: fas fa-photo-film
    displayData:
      color: "#3f8f9f"
    items:
      - title: Navidrome
        description: Music server
        url: https://navidrome.zetaphor.space
        icon: fas fa-music
      - title: slskd
        description: Soulseek daemon UI
        url: https://soulseek.zetaphor.space
        icon: fas fa-network-wired
      - title: SoulSync
        description: SoulSync web UI
        url: https://music.zetaphor.space
        icon: fas fa-compact-disc

  - name: Theta Services
    icon: fas fa-server
    displayData:
      color: "#4f7a58"
    items:
      - title: Plex
        description: Media server
        url: https://plex.zetaphor.space/web
        icon: fas fa-tv
      - title: Radarr
