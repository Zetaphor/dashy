    items:
      - title: SearXNG
        description: Metasearch
        url: https://searx.zetaphor.space
        icon: fas fa-search
      - title: Sigma Desktop
        description: Browser VNC to sigma XFCE desktop
        url: https://desktop.zetaphor.space/vnc.html?autoconnect=1&resize=scale
        icon: fas fa-desktop
      - title: Files
        description: FileBrowser Quantum — sigma home dir, no login
        url: https://files.zetaphor.space
        icon: fas fa-folder-open
      - title: systemd
